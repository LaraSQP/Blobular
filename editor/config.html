<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset = "UTF-8">
	<meta name    = "viewport" content="width=device-width, initial-scale=1">
	<title>Blob Configuration</title>
	<style>
		* { box-sizing: border-box; }

		body {
			font: 16px Arial, sans-serif;
			max-width: 560px;
			margin: 30px auto;
			padding: 0 18px;
			background: #1c1f29;
			color: #e4ecfa;
		}

		h1 { font-size: 24px; }

		.setting { margin: 24px 0; }

		.setting label {
			display: block;
			margin-bottom: 10px;
		}

		.color-row {
			display: flex;
			align-items: center;
			gap: 12px;
		}

		input[type="color"] {
			width: 60px;
			height: 38px;
			padding: 2px;
			cursor: pointer;
		}

		.hex-value {
			font-family: Consolas, monospace;
			font-size: 15px;
			min-width: 90px;
		}

		input[type="range"] {
			width: 100%;
			margin: 8px 0;
		}

		.range-labels {
			display: flex;
			justify-content: space-between;
			font-size: 13px;
			color: #aab3c7;
		}

		.selected-value {
			float: right;
			font-family: Consolas, monospace;
			font-weight: bold;
		}

		button {
			padding: 10px 18px;
			margin: 8px 8px 8px 0;
			cursor: pointer;
		}

		#status {
			margin-top: 18px;
			overflow-wrap: anywhere;
		}
	</style>
</head>
<body>
	<h1>Blob Configuration</h1>

	<div class="setting">
		<label for = "blobColor">Blob color</label>
		<div class = "color-row">
			<input type = "color" id="blobColor">
			<span class = "hex-value" id="blobColorHex"></span>
		</div>
	</div>

	<div class="setting">
		<label for = "upperLight">Upper light</label>
		<div class = "color-row">
			<input type = "color" id="upperLight">
			<span class = "hex-value" id="upperLightHex"></span>
		</div>
	</div>

	<div class="setting">
		<label for = "lowerLight">Lower light</label>
		<div class = "color-row">
			<input type = "color" id="lowerLight">
			<span class = "hex-value" id="lowerLightHex"></span>
		</div>
	</div>

	<div class="setting">
		<label for = "ambientLight">Ambient light</label>
		<div class = "color-row">
			<input type = "color" id="ambientLight">
			<span class = "hex-value" id="ambientLightHex"></span>
		</div>
	</div>

	<div class="setting">
		<label for="speed">
			Speed
			<span class="selected-value" id="speedValue"></span>
		</label>
		<input type = "range" id="speed" min="0" max="2" step="0.05">
		<div class  = "range-labels"><span>0</span><span>2</span></div>
	</div>

	<div class="setting">
		<label for="spikes">
			Spikes
			<span class="selected-value" id="spikesValue"></span>
		</label>
		<input type = "range" id="spikes" min="0.1" max="5" step="0.05">
		<div class  = "range-labels"><span>0.1</span><span>5</span></div>
	</div>

	<div class="setting">
		<label for="processing">
			Processing
			<span class="selected-value" id="processingValue"></span>
		</label>
		<input type = "range" id="processing" min="0.1" max="2" step="0.05">
		<div class  = "range-labels"><span>0.1</span><span>2</span></div>
	</div>

	<button id = "save">Save settings</button>
	<button id = "reset">Reset defaults</button>

	<p id="status">Loading settings...</p>

	<script>
		const defaults = {
			blobColor: '#e4ecfa',
			upperLight: '#a7f8ab',
			lowerLight: '#b7b7b4',
			ambientLight: '#013404',
			speed: 0.5,
			spikes: 1.75,
			processing: 1.0
		};

		const colors = [
			'blobColor', 'upperLight', 'lowerLight', 'ambientLight'
		];

		const ranges = {
			speed: [0, 2],
			spikes: [0.1, 5],
			processing: [0.1, 2]
		};

		const $ = id => document.getElementById(id);

		function showValues(config) {
			for (const key of colors) {
				$(key).value               = config[key];
				$(key + 'Hex').textContent = config[key].toUpperCase();
			}

			for (const key of Object.keys(ranges)) {
				$(key).value = config[key];
				$(key + 'Value').textContent =
					Number(config[key]).toFixed(2);
			}
		}

		function getValues() {
			const config = {};

			for (const key of colors) {
				config[key] = $(key).value;
			}

			for (const key of Object.keys(ranges)) {
				config[key] = Number($(key).value);
			}

			return config;
		}

		for (const key of colors) {
			$(key).addEventListener('input', () => {
				$(key + 'Hex').textContent =
					$(key).value.toUpperCase();
			});
		}

		for (const key of Object.keys(ranges)) {
			$(key).addEventListener('input', () => {
				$(key + 'Value').textContent =
					Number($(key).value).toFixed(2);
			});
		}

		async function loadSettings() {
			const response = await fetch('../blob-config.json', {
				cache: 'no-store'
			});

			if (!response.ok) {
				throw new Error(
					'Could not load settings (HTTP ' + response.status + ')'
				);
			}

			let config;

			try {
				config = await response.json();
			} catch {
				throw new Error(
					'Invalid JSON. Check blob-config.json contains only valid JSON.'
				);
			}

			showValues(config);
			$('status').textContent = 'Settings loaded.';
		}

		async function saveSettings(config) {
			$('status').textContent = 'Saving...';
			$('save').disabled      = true;

			try {
				const response = await fetch('save.php', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(config)
				});

				let result;

				try {
					result = await response.json();
				} catch {
					throw new Error(
						'The server did not return JSON. Check PHP errors and authentication.'
					);
				}

				if (!response.ok) {
					throw new Error(result.error || 'Save failed');
				}

				$('status').textContent = 'Settings saved successfully.';
			} catch (error) {
				$('status').textContent = 'Error: ' + error.message;
			} finally {
				$('save').disabled = false;
			}
		}

		$('save').addEventListener('click', () => {
			saveSettings(getValues());
		});

		$('reset').addEventListener('click', () => {
			showValues(defaults);
			saveSettings(defaults);
		});

		loadSettings().catch(error => {
			$('status').textContent = 'Error: ' + error.message;
		});
	</script>
</body>
</html>
